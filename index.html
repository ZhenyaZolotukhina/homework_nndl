<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Titanic EDA Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b1020;
      color: #eaefff;
    }
    header {
      padding: 16px;
      background: #121a3a;
      border-bottom: 1px solid #2a3566;
    }
    h1 {
      margin: 0;
      font-size: 20px;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 16px;
    }
    .card {
      background: #111936;
      border: 1px solid #2a3566;
      border-radius: 12px;
      margin-bottom: 16px;
      padding: 12px;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: #6b8cff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #2a3566;
      color: #eaefff;
    }
    select {
      background: #0b1020;
      color: #eaefff;
      border: 1px solid #2a3566;
      border-radius: 8px;
      padding: 6px 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .plot {
      height: 380px;
    }
    .conclusion {
      background: #162055;
      border-left: 4px solid #6b8cff;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.55;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: #9aa6ff;
      padding: 16px;
    }
  </style>
</head>

<body>
<header>
  <h1>🚢 Titanic EDA Dashboard (Interactive)</h1>
</header>

<div class="container">

  <div class="card">
    <div class="controls">
      <button id="loadBtn">Load Titanic Data</button>
      <select id="featureSelect"></select>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Survival Rate by Category</h3>
      <div id="barSurvival" class="plot"></div>
    </div>
    <div class="card">
      <h3>Distribution (Survived vs Died)</h3>
      <div id="distPlot" class="plot"></div>
    </div>
  </div>

  <div class="card">
    <h3>Feature Importance (EDA-based)</h3>
    <div id="importancePlot" class="plot"></div>
  </div>

  <div class="card conclusion">
    <h3>Final Conclusion</h3>
    <div id="finalText"></div>
  </div>

</div>

<footer>
  Browser-only EDA · GitHub Pages ready · train + test merged
</footer>

<script src="app.js"></script>
</body>
</html>
